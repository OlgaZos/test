name: Deploy brief app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Improve wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('shergina-brief/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Что ты хотела бы получить в руках после двух месяцев работы?',
              'Какой результат ты хотела бы получить после двух месяцев работы?'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./shergina-brief
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

