name: Deploy brief app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install checksum-verified birthday game in its own directory
        if: ${{ hashFiles('shergina-brief/dima/index.html') == '' }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, stat, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          url = 'https://at.adobe.com/phbDMg3cGt09HqaL'
          expected = '2eefa4b43850a94d98370450a402a57b9945b1bea3238fdb490fa830636bd034'
          req = urllib.request.Request(url, headers={'User-Agent': 'Dima-birthday-site-publisher/1.0'})
          with urllib.request.urlopen(req, timeout=90) as response:
              data = response.read(10_000_001)
          digest = hashlib.sha256(data).hexdigest()
          if digest != expected:
              raise RuntimeError('Archive checksum mismatch: ' + digest)
          target = Path('shergina-brief/dima')
          if target.exists():
              raise RuntimeError('Refusing to replace an existing site directory')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              members = archive.infolist()
              if sum(m.file_size for m in members) > 10_000_000:
                  raise RuntimeError('Archive too large')
              names = {m.filename for m in members}
              if not {'index.html', 'style.css', 'app.js'}.issubset(names):
                  raise RuntimeError('Missing site entry files')
              for m in members:
                  p = PurePosixPath(m.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in m.filename or stat.S_ISLNK(m.external_attr >> 16):
                      raise RuntimeError('Unsafe archive member')
                  if p.parts[0] not in {'index.html','style.css','app.js','README.txt','assets'}:
                      raise RuntimeError('Unexpected archive member')
              target.mkdir(parents=True)
              for m in members:
                  p = target.joinpath(*PurePosixPath(m.filename).parts)
                  if m.is_dir():
                      p.mkdir(parents=True, exist_ok=True)
                  else:
                      p.parent.mkdir(parents=True, exist_ok=True)
                      p.write_bytes(archive.read(m))
          print('Verified and installed birthday game; original brief untouched.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- shergina-brief/dima
          git commit -m 'Add tested Dmitry birthday game and cartoon assets'
          git push origin HEAD:main
      - name: Improve wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('shergina-brief/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Что ты хотела бы получить в руках после двух месяцев работы?',
              'Какой результат ты хотела бы получить после двух месяцев работы?'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./shergina-brief
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

