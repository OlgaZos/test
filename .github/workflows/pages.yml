name: Deploy brief app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read the previously published autumn game without changing it
        uses: actions/checkout@v4
        with:
          ref: bffcee65ba88718ba40f2f0f2c30030402fb1257
          path: .previous-published-site
          sparse-checkout: kro-monthly-games
      - name: Improve wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('shergina-brief/index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Что ты хотела бы получить в руках после двух месяцев работы?',
              'Какой результат ты хотела бы получить после двух месяцев работы?'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Keep all published applications at their existing paths
        run: |
          mkdir -p _site/kro-monthly-games
          cp -a shergina-brief/. _site/
          cp -a .previous-published-site/kro-monthly-games/. _site/kro-monthly-games/
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live pages and all birthday game assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import hashlib, os, time, urllib.request
          from pathlib import Path
          root = Path('_site')
          base = os.environ['PAGE_URL'].rstrip('/') + '/'
          files = [root / 'index.html', root / 'kro-monthly-games/index.html']
          files += sorted(p for p in (root / 'dima').rglob('*') if p.is_file())
          for path in files:
              relative = path.relative_to(root).as_posix()
              expected = hashlib.sha256(path.read_bytes()).digest()
              for attempt in range(10):
                  try:
                      request = urllib.request.Request(base + relative, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=30) as response:
                          data = response.read()
                      if hashlib.sha256(data).digest() != expected:
                          raise RuntimeError('Published content differs from deployment: ' + relative)
                      print('HTTP OK; checksum verified:', relative)
                      break
                  except Exception:
                      if attempt == 9:
                          raise
                      time.sleep(3)
          print('Birthday game is public at ' + base + 'dima/')
          PY

# The birthday game lives at /dima/. Previously published URLs are preserved.
