<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4ad32" />
    <title>Игра месяца от Школы-крохи</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        color: #28362b;
        font-family: Inter, system-ui, sans-serif;
        background: radial-gradient(circle at 20% 5%, #ffe09a, transparent 28rem), #e8eed9;
      }
      main {
        width: min(100%, 780px);
        padding: clamp(24px, 6vw, 54px);
        border-radius: 28px;
        background: rgba(255, 253, 246, 0.95);
        box-shadow: 0 18px 50px rgba(62, 72, 51, 0.18);
      }
      p:first-child {
        color: #9a5c1f;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: .05em;
      }
      h1 { margin: 8px 0; font-size: clamp(34px, 8vw, 58px); line-height: 1; }
      h2 { margin: 28px 0 8px; }
      a {
        display: inline-flex;
        min-height: 54px;
        margin-top: 18px;
        align-items: center;
        justify-content: center;
        padding: 13px 22px;
        border-radius: 16px;
        color: #28362b;
        font-weight: 850;
        text-decoration: none;
        background: linear-gradient(145deg, #ffd15e, #f4ad32);
        box-shadow: 0 10px 22px rgba(181, 104, 24, .2);
      }
    </style>
  </head>
  <body>
    <main>
      <p>Школа-кроха</p>
      <h1>Игра месяца</h1>
      <p>Короткие семейные игры для детей 4–6 лет: без регистрации, установки и рекламы.</p>
      <h2>Осень в лесу</h2>
      <p>Как животные готовятся к холодам — 5 заданий на внимание, логику и речь.</p>
      <a href="games/autumn-animals/">Играть вместе с ребёнком</a>
    </main>
  </body>
</html>
