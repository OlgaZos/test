<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Мобильная проверка — Игра месяца</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        font-family: system-ui, sans-serif;
        background: #d9dfd2;
      }
      .device {
        width: 414px;
        max-width: 100%;
        padding: 11px;
        border: 7px solid #252825;
        border-radius: 42px;
        background: #252825;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      }
      .speaker {
        width: 80px;
        height: 5px;
        margin: 1px auto 9px;
        border-radius: 99px;
        background: #626663;
      }
      iframe {
        display: block;
        width: 390px;
        max-width: 100%;
        height: 844px;
        border: 0;
        border-radius: 27px;
        background: #f7efd9;
      }
    </style>
  </head>
  <body>
    <div class="device">
      <div class="speaker" aria-hidden="true"></div>
      <iframe title="Мобильная версия игры" src="../games/autumn-animals/?utm_source=qa-mobile"></iframe>
    </div>
  </body>
</html>
